[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rulelens"
version = "0.1.0"
description = "Enterprise Policy Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "reportlab>=4.0.0",
    "pymupdf>=2.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.0",
    "qdrant-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
