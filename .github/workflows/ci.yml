name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline_tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RULELENS_CACHE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install --no-deps dist/rulelens-*.whl
          python -m pip check
      - name: Check corpus
        run: python -m rulelens.ingestion validate
      - name: Run offline tests
        run: python -m pytest -q -p no:cacheprovider --basetemp=.pytest_tmp
